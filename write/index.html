<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write · duckposting</title>
<link rel="stylesheet" href="./editor.css">
<style>
  body { max-width: 44rem; margin: 2rem auto; padding: 0 1rem; color: #222; font: 18px/1.7 Georgia, serif; }
  h1, h2, h3 { line-height: 1.2; }
  a { color: #3656a3; }
</style>
<main id="writer">Loading duckposting…</main>
<script type="module">
  import { mountDuckposting } from "./editor.js";
  await mountDuckposting(document.querySelector("#writer"), {
    repository: "YOUR-USERNAME/YOUR-BLOG",
    branch: "main",
    contentDir: "content/posts",
    template: '---\ntitle: ""\ndate: {{date}}\n---\n\n',
  });
</script>
</html>
